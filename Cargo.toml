[workspace]
resolver = "2"
members = [
    "crates/morph-crypto-core",
    "crates/morph-crypto-policy",
    "crates/morph-crypto-lineage",
    "crates/morph-crypto-transition",
    "crates/morph-crypto-verifier",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
